openapi: 3.0.3
info:
  title: Nightscout Roles Gateway API
  description: |
    A cloud-native RBAC controller for Nightscout. NRG provides a REST API to store 
    and enforce scheduled group policies for registered Nightscout sites.
    
    ## Architecture Overview
    
    NRG operates as part of a multi-component system:
    
    - **WWW Viewer Frontend**: A web interface that allows authenticated viewing of 
      configured Nightscout instances at vanity URLs (e.g., `yoursite.example.com`).
    - **Control Panel**: An administrative interface (e.g., T1Pal) that uses this REST API 
      to register sites, configure policies, manage groups, and set up access rules.
    - **NGINX Load Balancer**: Uses NRG's Warden endpoints via `auth_request` directives 
      to verify site authenticity, authorize users, and obtain upstream URIs for proxying.
    
    ## Access Modes
    
    NRG supports three orthogonal access conditions for registered Nightscout sites:
    
    1. **Anonymous/Public Access**: The site is available at its vanity URL for anyone. 
       Standard Nightscout authentication (API secret or token) applies for privileged operations.
    
    2. **Identity-Mapped Access**: Visitors must be logged in and consent to being in the 
       usage log. User identities or groups can be mapped to Nightscout authorization tokens 
       (nsjwt shiros), optionally on a weekly schedule.
    
    3. **Legacy Device Escape Hatch**: Allows uploaders and legacy devices using the correct 
       API secret to bypass login requirements while identity features remain active for 
       web visitors (`exempt_matching_api_secret`).
    
    ## BYOD Nightscout Validation
    
    The system supports "Bring Your Own Nightscout" (BYOD), allowing users to register 
    their existing Nightscout instances. To prevent misuse as an open proxy, NRG includes 
    a criteria-based validation system that audits Nightscout instances for authenticity, 
    liveness, and proper configuration before allowing registration.
    
    See the Nightscout audit endpoints for details on the validation criteria.
  version: 0.0.1
  contact:
    name: Ben West
  license:
    name: MIT

servers:
  - url: http://localhost:5000
    description: Development server

tags:
  - name: Status
    description: Health check and status endpoints
  - name: About
    description: Server and database introspection
  - name: Entities
    description: Generic entity CRUD operations
  - name: Objects
    description: Object management by kind
  - name: Workflows
    description: Site registration workflows
  - name: Owner
    description: Owner administration endpoints
  - name: Groups
    description: Group management and membership
  - name: Clients
    description: OAuth client management
  - name: Privy
    description: User identity and privacy endpoints
  - name: Warden
    description: Authentication gateway for load balancers
  - name: Nightscout
    description: Nightscout-specific audit and criteria

paths:
  /api/v1/status:
    get:
      tags:
        - Status
      summary: Health check
      description: Returns OK status if the server is running
      responses:
        '200':
          description: Server is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: boolean
                    example: true

  /api/v1/status/database:
    get:
      tags:
        - Status
      summary: Database health check
      description: Verifies database connectivity
      responses:
        '200':
          description: Database connection successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  ok:
                    type: integer
                    example: 1

  /api/v1/about/server:
    get:
      tags:
        - About
      summary: Server debug information
      description: Returns server configuration and debug details
      responses:
        '200':
          description: Server debug info

  /api/v1/about/database:
    get:
      tags:
        - About
      summary: List database tables
      description: Returns list of tables in the database
      responses:
        '200':
          description: List of table names
          content:
            application/json:
              schema:
                type: array
                items:
                  type: string

  /api/v1/about/database/{table}:
    get:
      tags:
        - About
      summary: Get table info
      description: Returns column and schema information for a table
      parameters:
        - name: table
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Table schema information

  /api/v1/objects/{kind}:
    post:
      tags:
        - Objects
      summary: Create a new object
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Object created successfully

  /api/v1/objects/{kind}/{id}:
    get:
      tags:
        - Objects
      summary: Get object by ID
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object details
    put:
      tags:
        - Objects
      summary: Update object by ID
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        '200':
          description: Object updated
    delete:
      tags:
        - Objects
      summary: Delete object by ID
      parameters:
        - name: kind
          in: path
          required: true
          schema:
            type: string
        - name: id
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Object deleted

  /api/v1/workflows/site/registrations:
    get:
      tags:
        - Workflows
      summary: Get registration suggestions
      responses:
        '200':
          description: Registration suggestions
    post:
      tags:
        - Workflows
      summary: Register a new site
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                expected_name:
                  type: string
                  description: The subdomain name for the site
                owner_ref:
                  type: string
                  description: Owner reference identifier
      responses:
        '200':
          description: Site registered successfully

  /api/v1/owner/{owner_ref}/synopsis:
    get:
      tags:
        - Owner
      summary: Get owner overview
      parameters:
        - name: owner_ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Owner synopsis with registered sites

  /api/v1/owner/{owner_ref}/groups:
    get:
      tags:
        - Groups
      summary: List owner's groups
      parameters:
        - name: owner_ref
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: List of groups
    post:
      tags:
        - Groups
      summary: Create a new group
      parameters:
        - name: owner_ref
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '200':
          description: Group created

  /api/v1/nightscout/audit:
    post:
      tags:
        - Nightscout
      summary: Audit Nightscout site criteria
      description: |
        Validates and triages Nightscout site authenticity for BYOD (Bring Your Own Nightscout) 
        registration. This endpoint is a security gate that prevents the system from being 
        misused as an open proxy by validating that the provided upstream is a legitimate 
        Nightscout instance.
        
        ## Validation Pipeline
        
        The audit runs through three inspection stages:
        
        1. **Static Analysis**: Validates API secret syntax (minimum length) and URL format 
           (valid hostname).
        
        2. **API Liveness Check**: Attempts to reach the Nightscout `/api/v1/status.json` 
           endpoint to verify the instance is reachable and responding.
        
        3. **Authenticated API Check**: Verifies the API secret works by making an 
           authenticated request to the status endpoint.
        
        ## Criteria Structure
        
        Each check produces a criterium with:
        - `group`: Category of the check (e.g., "Nightscout API Secret", "Nightscout URL")
        - `property`: What is being checked
        - `criteria`: The requirement being evaluated
        - `outcome`: Description of the actual result
        - `passing`: Boolean indicating if the check passed
        - `mandatory`: If true, failure blocks registration; if false, it's a warning
        
        ## Response
        
        Returns a synopsis with overall status (`OK` or `not ok`), `acceptable` boolean, 
        and detailed breakdown of passing checks, warnings, and rejections.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                upstream_origin:
                  type: string
                  description: The full URL of the Nightscout instance to validate. Optional when re-auditing an existing registration.
                  example: "https://my-nightscout.herokuapp.com"
                api_secret:
                  type: string
                  description: The API_SECRET configured on the Nightscout instance. Optional when re-auditing an existing registration (retrieved from stored secrets).
      responses:
        '200':
          description: Audit results with synopsis and detailed criteria outcomes
          content:
            application/json:
              schema:
                type: object
                properties:
                  synopsis:
                    type: object
                    properties:
                      txt:
                        type: string
                        description: Human-readable summary
                      status:
                        type: string
                        enum: [OK, "not ok"]
                      acceptable:
                        type: boolean
                        description: True if no mandatory criteria failed
                      details:
                        type: object
                        properties:
                          passing:
                            type: integer
                          warning:
                            type: integer
                          rejects:
                            type: integer
                  audit:
                    type: array
                    description: Individual criteria results
                    items:
                      type: object
                      properties:
                        group:
                          type: string
                        property:
                          type: string
                        criteria:
                          type: string
                        outcome:
                          type: string
                        passing:
                          type: boolean
                        mandatory:
                          type: boolean

  /warden/v1/active/backend/for/{expected_name}:
    get:
      tags:
        - Warden
      summary: Get active backend for site
      description: |
        Used by load balancers (NGINX) to verify site authenticity and user authorization.
        Returns the upstream URI in x-upstream-origin header when authorized.
      parameters:
        - name: expected_name
          in: path
          required: true
          schema:
            type: string
          description: The subdomain name to authorize
      responses:
        '200':
          description: Authorization decision with upstream origin
          headers:
            x-upstream-origin:
              schema:
                type: string
              description: The upstream URI for reverse proxy
        '403':
          description: Access denied
    head:
      tags:
        - Warden
      summary: Check backend availability (HEAD)
      parameters:
        - name: expected_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Backend available

components:
  schemas:
    Error:
      type: object
      properties:
        code:
          type: string
        message:
          type: string

    Site:
      type: object
      properties:
        id:
          type: string
        expected_name:
          type: string
        owner_ref:
          type: string
        full_domain:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Group:
      type: object
      properties:
        id:
          type: string
        name:
          type: string
        owner_ref:
          type: string
        description:
          type: string

  securitySchemes:
    ApiSecret:
      type: apiKey
      in: header
      name: api-secret
      description: Nightscout API_SECRET for site authentication
